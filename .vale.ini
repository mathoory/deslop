# deslop: Vale config for catching AI-writing tells.
# Styles: ai-tells + proselint (published, fetched by `vale sync`) and Claudisms (ours, in styles/Claudisms).
# StylesPath is relative to this file, so the repo works wherever it is cloned.
StylesPath = styles
MinAlertLevel = suggestion
Packages = ai-tells, proselint

[*.{md,txt,html,rst,tex}]
BasedOnStyles = ai-tells, proselint, Claudisms
# ai-tells also flags en-dashes, which breaks ranges like "Jan–Feb". Claudisms.EmDash flags only "—".
ai-tells.EmDashUsage = NO
